%YAML 1.2
---
$id: http://devicetree.org/schemas/gpio/realtek,rtl8197f-gpio.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Realtek RTL8197F/RTL8197FH GPIO controller

maintainers:
  - OpenWrt RTL8197F bringup <noreply@example.invalid>

properties:
  compatible:
    enum:
      - realtek,rtl8197f-gpio
      - realtek,rtl8197fh-gpio

  reg:
    maxItems: 1

  gpio-controller: true

  '#gpio-cells':
    const: 2

  ngpios:
    minimum: 1
    maximum: 64

  interrupt-controller: true

  '#interrupt-cells':
    const: 2

  interrupt-parent: true

  interrupts:
    minItems: 1
    maxItems: 2
    description: GPIO bank interrupt lines from the RTL8197F interrupt controller.

required:
  - compatible
  - reg
  - gpio-controller
  - '#gpio-cells'
  - ngpios

additionalProperties: false

examples:
  - |
    gpio-controller@3500 {
        compatible = "realtek,rtl8197f-gpio";
        reg = <0x3500 0x38>;
        gpio-controller;
        #gpio-cells = <2>;
        ngpios = <64>;
        interrupt-controller;
        #interrupt-cells = <2>;
        interrupt-parent = <&intc>;
        interrupts = <16 2>, <17 2>;
    };
...
